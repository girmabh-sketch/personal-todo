<h2>Hello</h2>
<table mat-table [dataSource]=taskgroups>

  <ng-container matColumnDef="Category Name">
    <td mat-cell *matCellDef="let element">

      <button mat-raised-button color="primary" (click)="updateTaskData(element.taskItems,element.type )"> {{ element.type | typeEnumValue}}</button>
    </td>
  </ng-container>
  <ng-container matColumnDef="Number of Tasks">
    <td mat-cell *matCellDef="let element">
      {{ element.taskItems.length}}
    </td>
  </ng-container>

  <!--<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>-->
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
