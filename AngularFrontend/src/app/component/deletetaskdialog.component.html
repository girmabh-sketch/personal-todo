<h2 mat-dialog-actions align="center">Delete</h2>
<mat-dialog-content>
  <p>Are you sure you want to delete the seleted task(s)?</p>
</mat-dialog-content>
<mat-dialog-actions class="button-group">
  <button mat-button color="primary"  (click)="onYes()">Yes</button>
  <button mat-button matDialogClose="cancel" color="accent" (click)="onNo()">No</button>
</mat-dialog-actions>
